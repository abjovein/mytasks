*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#20231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.side{position:fixed;inset:0 auto 0 0;width:230px;background:white;border-right:1px solid #e4e8e0;padding:28px 16px;overflow:auto}.logo{font-size:23px;font-weight:800;padding:0 12px 28px}.logo span{color:#5d7650}.nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;color:#50564e;margin:3px 0;cursor:pointer}.nav .active{background:#eaf0e7;color:#5d7650;font-weight:700}.nav .section{font-size:11px;color:#9aa097;text-transform:uppercase;letter-spacing:.08em;margin:18px 10px 6px}.main{margin-left:230px;padding:34px 42px;max-width:1150px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.date{color:#747a72;font-size:14px}.title{font-size:32px;font-weight:800}.add,.quick button{border:0;background:#5d7650;color:white;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel,.emptybox{background:white;border:1px solid #e4e8e0;border-radius:15px;padding:17px}.stat{cursor:pointer}.stat:hover{border-color:#5d7650}.stat b{font-size:25px}.caticon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#eaf0e7;color:#5d7650}.caticon svg{width:25px;height:25px;display:block}.stat small{display:block;color:#747a72}.layout{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.panel h2{font-size:18px;margin:0 0 14px}.quick{display:flex;gap:8px}.quick input{flex:1;border:1px solid #e4e8e0;border-radius:9px;padding:11px}.quick button{background:#eaf0e7;color:#5d7650}.filters{display:flex;gap:7px;margin:10px 0;flex-wrap:wrap}.filters button,.viewtabs button{border:1px solid #e4e8e0;background:white;border-radius:8px;padding:7px 10px;color:#747a72;cursor:pointer}.filters .active,.viewtabs .active{background:#eaf0e7;color:#5d7650}.task{display:flex;gap:11px;padding:13px 2px;border-bottom:1px solid #e4e8e0;align-items:flex-start}.check{width:20px;height:20px;border:2px solid #adb5a9;border-radius:50%;flex:none;cursor:pointer}.task.done .check{background:#5d7650;border-color:#5d7650}.task.done .txt{text-decoration:line-through;color:#9ba099}.meta{font-size:12px;color:#747a72;margin-top:4px}.task-actions{margin-left:auto;display:flex;gap:5px}.task-actions button{border:0;background:#f1f3ef;border-radius:6px;padding:4px 6px;font-size:11px;cursor:pointer}.high{color:#b65a51;font-size:11px;margin-left:6px;font-weight:700}.bar{height:7px;background:#edf0eb;border-radius:8px;margin:9px 0 14px}.fill{height:100%;background:#5d7650;border-radius:8px}.other{display:none}.other.show{display:block}.today.hide{display:none}.viewtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.viewtabs button{font-weight:600}.dayhead{display:flex;justify-content:space-between;align-items:center;margin:17px 0 5px}.dayhead h3{margin:0;font-size:15px}.badge{font-size:11px;background:#f1f3ef;border-radius:20px;padding:4px 8px;color:#747a72}.monthgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.monthbox{background:#fff;border:1px solid #e4e8e0;border-radius:13px;padding:13px}.monthbox h3{margin:0 0 9px;font-size:15px}.yearlist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.birthday{border-left:4px solid #d9a441;padding-left:10px}.empty{color:#747a72;padding:18px 2px}.modal{display:none;position:fixed;inset:0;background:#0005;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.box{background:white;border-radius:16px;padding:22px;width:min(430px,100%);max-height:90vh;overflow:auto}.box input,.box select,.box textarea{width:100%;padding:11px;border:1px solid #e4e8e0;border-radius:9px;margin:6px 0 12px}.actions{text-align:right}.actions button{border:0;border-radius:9px;padding:10px 14px;margin-left:7px;cursor:pointer}.save{background:#5d7650;color:white}.hint{font-size:12px;color:#747a72;margin-top:-7px;margin-bottom:10px}
@media(max-width:700px){.side{width:65px;padding:20px 6px}.logo{font-size:0;text-align:center}.logo span{font-size:22px}.nav button{font-size:0;text-align:center;padding:11px 6px}.nav .section{font-size:0;height:8px;margin:8px 0}.main{margin-left:65px;padding:22px 12px}.title{font-size:26px}.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.top{align-items:center}.top .add{padding:9px 11px;font-size:12px}.monthgrid,.yearlist{grid-template-columns:1fr}.viewtabs{gap:5px}.viewtabs button{padding:6px 8px;font-size:12px}}
</style></head><body>
<aside class="side"><div class="logo">My<span>Tasks</span></div><div class="nav">
<button class="active" onclick="page('Today',this)">Today</button>
<button onclick="page('All Tasks',this)">All Tasks</button>
<button onclick="page('Daily',this)">Daily</button>
<button onclick="page('Weekly',this)">Weekly</button>
<button onclick="page('Monthly',this)">Monthly</button>
<button onclick="page('Yearly',this)">Yearly</button>
<div class="section">Organise</div>
<button onclick="page('Birthdays',this)">Birthdays</button>
<button onclick="page('Projects',this)">Projects</button>
<button onclick="page('Recurring',this)">Recurring</button>
<button onclick="page('Ideas',this)">Ideas</button>
<button onclick="page('Completed',this)">Completed</button>
</div></aside>
<main class="main"><div class="top"><div><div class="date" id="date"></div><div class="title" id="title">Today</div></div><div style="display:flex;gap:8px"><button class="add" onclick="startVoiceTask()">Add task by voice</button><button class="add" onclick="openAdd()"> Add task</button></div></div>
<div id="today" class="today"><div class="stats">
<div class="stat" onclick="categoryView('Others')"><b class="caticon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 10v7M24 31v7M10 24h7M31 24h7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="24" r="3" fill="currentColor"/></svg></b><small>Others</small></div>
<div class="stat" onclick="categoryView('Home &amp; Garden')"><b class="caticon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 23 24 10l16 13v15H8V23Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M19 38V27h10v11M15 18h18" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></b><small>Home &amp; Garden</small></div>
<div class="stat" onclick="categoryView('Properties')"><b class="caticon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 21 24 9l16 12v18H8V21Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M17 39V25h14v14M13 20h22" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M24 25v14" stroke="currentColor" stroke-width="3"/></svg></b><small>Properties</small></div>
<div class="stat" onclick="categoryView('Fitness')"><b class="caticon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 19v10M17 16v16M31 16v16M36 19v10M7 24h34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></b><small>Fitness</small></div>
</div>
<div class="layout"><section class="panel"><h2>Today's tasks</h2><div class="quick"><input id="quick" placeholder="What needs doing?" onkeydown="if(event.key==='Enter')quickAdd()"><button onclick="quickAdd()">Add</button></div><div style="margin:8px 0"><input id="searchBox" placeholder="Search today's tasks..." oninput="render()" style="width:100%;padding:9px;border:1px solid #e4e8e0;border-radius:9px;background:#fafbf9"></div><div class="filters"><button class="active" onclick="setFilter('all',this)">All</button><button onclick="setFilter('high',this)">High</button><button onclick="setFilter('open',this)">Open</button><button onclick="setFilter('done',this)">Done</button></div><div id="tasks"></div></section>
<section class="panel"><h2>Task categories</h2><p class="meta">Tap a category above to see its tasks. Use <b>All Tasks</b> for everything.</p><div class="filters"><button onclick="categoryView('Others')">Others</button><button onclick="categoryView('Home &amp; Garden')">Home &amp; Garden</button><button onclick="categoryView('Properties')">Properties</button><button onclick="categoryView('Fitness')">Fitness</button></div></section></div></div>
<div id="other" class="other"></div></main>
<div id="modal" class="modal"><div class="box"><h2 id="modalTitle">Add a task</h2><input id="nt" placeholder="What needs doing?"><div id="birthdayHint" class="hint" style="display:none">Birthday will repeat automatically every year.</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="cat"><option>Others</option><option>Home &amp; Garden</option><option>Properties</option><option>Fitness</option><option>Birthdays</option><option>Ideas</option></select><select id="property"><option value="">No property</option><option>Medwin</option><option>Clayponds</option><option>Marcourt</option><option>Green Parade</option><option>Rugby</option><option>Landmere</option><option>Station Road</option></select><select id="pri"><option value="normal">Normal priority</option><option value="high">High priority</option></select></div>
<label style="font-size:12px;color:#747a72">Due date / Birthday</label><input id="due" type="date"><label style="font-size:12px;color:#747a72">Time (optional)</label><input id="tm" type="time"><label style="font-size:12px;color:#747a72">Repeat</label><select id="repeat"><option value="none">Does not repeat</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option><option value="yearly">Every year</option></select><label style="font-size:12px;color:#747a72">Reminder (optional)</label><input id="reminder" type="datetime-local"><label style="font-size:12px;color:#747a72">Notes (optional)</label><textarea id="notes" rows="3" placeholder="Add a note..."></textarea><div class="actions"><button onclick="closeAdd()">Cancel</button><button class="save" onclick="saveTask()">Add task</button></div></div></div>
<script>
const K='mytasks-v2',T=()=>new Date().toISOString().slice(0,10);let pageName='Today';let tasks=JSON.parse(localStorage.getItem(K)||'null')||[
{id:1,t:'Water the new plants',cat:'Garden',p:'normal',due:T(),done:false},{id:2,t:'5 km run',cat:'Fitness',p:'normal',due:T(),done:false},{id:3,t:'Buy garden soil',cat:'Errands',p:'high',due:T(),done:false},{id:4,t:'Book appointment',cat:'Others',p:'normal',due:T(),done:false},{id:5,t:'Check patio planting',cat:'Garden',p:'normal',due:T(),done:true}];let f='all',statFilter='';
tasks=tasks.map(x=>{
  if(x.cat==='Personal') x.cat='Others';
  if(x.cat==='Home') x.cat='Home & Garden';
  if(x.cat==='Garden') x.cat='Home & Garden';
  if(x.cat==='Other') x.cat='Others';
  return x;
});
save();
function save(){localStorage.setItem(K,JSON.stringify(tasks))}
function normalizeCategory(c){if(c==='Garden')return 'Properties';if(c==='Home'||c==='Home and Garden')return 'Home & Garden';if(c==='Personal'||c==='Other')return 'Others';return c||'Others'}function migrateCategories(){tasks.forEach(x=>{x.cat=normalizeCategory(x.cat);if(x.property)x.cat='Properties';});save()}migrateCategories();
function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function fmtDate(s){if(!s)return 'No date';let d=new Date(s+'T00:00:00');return new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(d)}
function taskHTML(x,showDate=true){let date=x.birthday?birthdayDateLabel(x):fmtDate(x.due);return '<div class="task '+(x.done?'done':'')+(x.birthday?' birthday':'')+'"><div class="check" onclick="toggle('+x.id+')"></div><div style="min-width:0"><div class="txt">'+(x.birthday?'':'')+esc(x.t)+(x.p==='high'?'<span class="high">HIGH</span>':'')+'</div><div class="meta">'+esc(x.cat)+(x.property?'  -  '+esc(x.property):'')+(showDate&&date?'  -  '+esc(date):'')+(x.time?'  -  '+esc(x.time):'')+(x.reminder?'  -  ':'')+'</div></div><div class="task-actions"><button onclick="editTask('+x.id+')">Edit</button><button onclick="deleteTask('+x.id+')">Delete</button></div></div>'}
function render(){let d=T(),a=tasks.filter(x=>x.due===d&&!x.birthday);rem.textContent=a.filter(x=>!x.done).length;comp.textContent=a.filter(x=>x.done).length;high.textContent=a.filter(x=>!x.done&&x.p==='high').length;over.textContent=tasks.filter(x=>!x.done&&x.due&&x.due<d&&!x.birthday).length;let q=(document.getElementById('searchBox')?.value||'').toLowerCase().trim(),l=q?a.filter(x=>(x.t+' '+x.cat).toLowerCase().includes(q)):a;if(statFilter==='remaining')l=a.filter(x=>!x.done);if(statFilter==='completed')l=a.filter(x=>x.done);if(statFilter==='high')l=a.filter(x=>!x.done&&x.p==='high');if(statFilter==='overdue')l=tasks.filter(x=>!x.done&&x.due&&x.due<d&&!x.birthday);if(!statFilter&&f==='high')l=l.filter(x=>x.p==='high');if(!statFilter&&f==='open')l=l.filter(x=>!x.done);if(!statFilter&&f==='done')l=l.filter(x=>x.done);l.sort((x,y)=>Number(x.done)-Number(y.done)||Number(y.p==='high')-Number(x.p==='high'));tasksDiv.innerHTML=l.length?l.map(x=>taskHTML(x,false)).join(''):'<div class="empty">Nothing here. Enjoy the clear space.</div>'}
function toggle(id){let x=tasks.find(y=>y.id===id);if(!x)return;x.done=!x.done;save();render();refreshOther()}
function quickAdd(){let v=quick.value.trim();if(!v)return;let parsed=parseTaskText(v);tasks.unshift({id:Date.now(),t:parsed.text,cat:parsed.cat,p:'normal',due:parsed.due,time:parsed.time,repeat:'none',notes:'',property:parsed.property,done:false});quick.value='';save();render();refreshOther()}
function openAdd(birthday=false){modal.classList.add('show');if(!nt.value)due.value=T();if(birthday){cat.value='Birthdays';repeat.value='yearly';birthdayHint.style.display='block';modalTitle.textContent='Add a birthday'}else{birthdayHint.style.display='none';modalTitle.textContent='Add a task'}nt.focus()}
function closeAdd(){modal.classList.remove('show');modalTitle.textContent='Add a task';birthdayHint.style.display='none';document.querySelector('.save').textContent='Add task';document.querySelector('.save').onclick=saveTask}
function startVoiceTask(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert('Voice input is not available in this browser. On iPhone, you can use the microphone on the keyboard or Siri/Shortcuts.');return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new SR();r.lang='en-GB';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>parseVoiceTask(e.results[0][0].transcript.trim());r.onerror=()=>alert('I could not hear that. Please try again.');r.start()}
function parseVoiceTask(text){let p=parseTaskText(text.replace(/^add task[,:]?\s*/i,''));nt.value=p.text;cat.value=p.cat;property.value=p.property||'';due.value=p.due||T();tm.value=p.time||'';openAdd()}
function parseTaskText(input){let t=input.trim(),date='',time='';let m=t.match(/(?:\bat\s+|@\s*)(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i);if(!m){m=t.match(/\b(\d{1,2}):(\d{2})\b/)}if(m){let h=+m[1],mi=m[2]||'00',ap=(m[3]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;time=String(h).padStart(2,'0')+':'+mi;t=t.replace(m[0],' ')}let dm=t.match(/\b(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?\b/);if(dm){let y=dm[3]?+dm[3]:new Date().getFullYear();if(y<100)y+=2000;date=y+'-'+String(+dm[2]).padStart(2,'0')+'-'+String(+dm[1]).padStart(2,'0');t=t.replace(dm[0],' ')}else{let mn={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};let md=t.match(/\b(\d{1,2})\s+(january|february|march|april|may|june|july|august|september|october|november|december)\b/i);if(md){let y=new Date().getFullYear();date=y+'-'+String(mn[md[2].toLowerCase()]).padStart(2,'0')+'-'+String(+md[1]).padStart(2,'0');t=t.replace(md[0],' ')}}if(/\btomorrow\b/i.test(t)){let d=new Date();d.setDate(d.getDate()+1);date=iso(d);t=t.replace(/\btomorrow\b/i,' ')}if(/\btoday\b/i.test(t)){date=T();t=t.replace(/\btoday\b/i,' ')}let props=['Medwin','Clayponds','Marcourt','Green Parade','Rugby','Landmere','Station Road'];let property=props.find(p=>new RegExp('\\b'+p.replace(/\s+/g,'\\s+')+'\\b','i').test(t))||'';let cat=property?'Properties':'Others';
if(!property&&/\b(birthday|birthdays)\b/i.test(t))cat='Birthdays';
if(!property&&/\b(idea|ideas)\b/i.test(t))cat='Ideas';if(!property&&/\b(gym|run|running|badminton|football|exercise|fitness)\b/i.test(t))cat='Fitness';else if(!property&&/\b(home|garden|gardening|house|plants|patio)\b/i.test(t))cat='Home & Garden';t=t.replace(/\s+/g,' ').trim();return {text:t||'New task',due:date||T(),time,property,cat}}

function saveTask(){let v=nt.value.trim();if(!v)return;let isB=cat.value==='Birthdays';tasks.unshift({id:Date.now(),t:v,cat:cat.value,p:pri.value,due:due.value||T(),time:tm.value||'',repeat:isB?'yearly':repeat.value,notes:notes.value.trim(),reminder:reminder.value||'',property:property.value||'',birthday:isB,done:false});resetForm();save();closeAdd();render();refreshOther()}
function resetForm(){nt.value='';tm.value='';notes.value='';reminder.value='';repeat.value='none';cat.value='Others';property.value='';;pri.value='normal';due.value=T()}
function editTask(id){let x=tasks.find(y=>y.id===id);if(!x)return;nt.value=x.t;cat.value=x.cat||'Others';pri.value=x.p||'normal';due.value=x.due||T();tm.value=x.time||'';repeat.value=x.repeat||'none';notes.value=x.notes||'';reminder.value=x.reminder||'';property.value=x.property||'';birthdayHint.style.display=x.birthday?'block':'none';modalTitle.textContent=x.birthday?'Edit birthday':'Edit task';openAdd(x.birthday);modalTitle.textContent=x.birthday?'Edit birthday':'Edit task';document.querySelector('.save').textContent='Save changes';document.querySelector('.save').onclick=function(){x.t=nt.value.trim()||x.t;x.cat=cat.value;x.p=pri.value;x.due=due.value||T();x.time=tm.value;x.repeat=x.birthday||x.cat==='Birthdays'?'yearly':repeat.value;x.notes=notes.value.trim();x.reminder=reminder.value;x.property=property.value;x.birthday=x.cat==='Birthdays';save();closeAdd();render();refreshOther()}}
function deleteTask(id){if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==id);save();render();refreshOther()}}
function showStat(x){statFilter=x;f='all';document.querySelectorAll('.filters button').forEach(q=>q.classList.remove('active'));document.querySelector('.filters button').classList.add('active');render()}
function setFilter(x,b){statFilter='';f=x;document.querySelectorAll('.filters button').forEach(q=>q.classList.remove('active'));b.classList.add('active');render()}
function page(n,b){pageName=n;statFilter='';f='all';document.querySelectorAll('.nav button').forEach(q=>q.classList.remove('active'));b.classList.add('active');title.textContent=n;today.className=n==='Today'?'today':'today hide';other.className=n==='Today'?'other':'other show';if(n!=='Today')other.innerHTML=viewHTML(n);}
function refreshOther(){if(pageName!=='Today')other.innerHTML=viewHTML(pageName)}
function categoryView(cat){pageName=cat;statFilter='';f='all';document.querySelectorAll('.nav button').forEach(q=>q.classList.remove('active'));title.textContent=cat;today.className='today hide';other.className='other show';other.innerHTML=box(cat+' tasks',tasks.filter(x=>x.cat===cat).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).map(x=>taskHTML(x,true)).join('')||'<div class="empty">No '+cat.toLowerCase()+' tasks yet.</div>')}
function allTasksView(){let list=[...tasks].sort((a,b)=>(a.birthday?1:0)-(b.birthday?1:0)||(a.due||'9999').localeCompare(b.due||'9999'));return box('All tasks',list.length?list.map(x=>taskHTML(x,true)).join(''):'<div class="empty">No tasks yet.</div>')}
function dailyView(){let d=T(),list=tasks.filter(x=>x.due===d&&!x.birthday);return box('Daily view - '+fmtDate(d),list.length?list.map(x=>taskHTML(x,false)).join(''):'<div class="empty">No tasks scheduled for today.</div>')}
function weeklyView(){let now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()),days=[];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=iso(d),list=tasks.filter(x=>x.due===key&&!x.birthday);days.push('<div class="dayhead"><h3>'+fmtDate(key)+'</h3><span class="badge">'+list.length+' task'+(list.length===1?'':'s')+'</span></div>'+(list.length?list.map(x=>taskHTML(x,false)).join(''):'<div class="empty">No tasks</div>'))}return box('Weekly view',days.join(''))}
function monthlyView(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),daysIn=new Date(y,m+1,0).getDate(),html='';for(let day=1;day<=daysIn;day++){let key=iso(new Date(y,m,day)),list=tasks.filter(x=>x.due===key&&!x.birthday);if(list.length)html+='<div class="dayhead"><h3>'+fmtDate(key)+'</h3><span class="badge">'+list.length+'</span></div>'+list.map(x=>taskHTML(x,false)).join('')}return box('Monthly view - '+new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(now),html||'<div class="empty">No tasks scheduled this month.</div>')}
function yearlyView(){let y=new Date().getFullYear(),months=[];for(let m=0;m<12;m++){let list=tasks.filter(x=>!x.birthday&&x.due&&x.due.startsWith(y+'-'+String(m+1).padStart(2,'0'))).sort((a,b)=>a.due.localeCompare(b.due));months.push('<div class="monthbox"><h3>'+new Intl.DateTimeFormat('en-GB',{month:'long'}).format(new Date(y,m,1))+' <span class="badge">'+list.length+'</span></h3>'+(list.length?list.map(x=>'<div class="task"><div><div class="txt">'+esc(x.t)+'</div><div class="meta">'+fmtDate(x.due)+(x.time?'  -  '+x.time:'')+(x.property?'  -  '+esc(x.property):'')+'</div></div></div>').join(''):'<div class="empty">No tasks</div>')+'</div>')}return box('Yearly view - '+y,'<div class="monthgrid">'+months.join('')+'</div>')}
function birthdayDateLabel(x){let d=new Date(x.due+'T00:00:00');return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long'}).format(d)}
function birthdaysView(){let list=tasks.filter(x=>x.birthday||x.cat==='Birthdays').sort((a,b)=>{let da=new Date(a.due+'T00:00:00'),db=new Date(b.due+'T00:00:00');return da.getMonth()-db.getMonth()||da.getDate()-db.getDate()});let out='<div class="emptybox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Birthdays</h2><button class="add" onclick="openAdd(true)"> Birthday</button></div>';out+=list.length?list.map(x=>taskHTML(x,true)).join(''):'<div class="empty">No birthdays yet. Add one and it will repeat every year.</div>';return out+'</div>'}
function box(h,c){return '<div class="emptybox"><h2 style="margin-top:0">'+h+'</h2>'+c+'</div>'}
function iso(d){return d.toISOString().slice(0,10)}
function viewHTML(n){if(n==='All Tasks')return allTasksView();if(n==='Daily')return dailyView();if(n==='Weekly')return weeklyView();if(n==='Monthly')return monthlyView();if(n==='Yearly')return yearlyView();if(n==='Birthdays')return birthdaysView();if(n==='Upcoming')return upcomingView();if(n==='Projects')return renderProjects();if(n==='Recurring')return renderRecurring();if(n==='Ideas')return renderIdeas();if(n==='Completed')return renderCompleted();return ''}
function upcomingView(){let d=T(),list=tasks.filter(x=>x.due&&x.due>d&&!x.birthday).sort((a,b)=>a.due.localeCompare(b.due));return box('Upcoming',list.length?list.map(x=>taskHTML(x,true)).join(''):'<div class="empty">No upcoming tasks yet.</div>')}
function renderIdeas(){let list=tasks.filter(x=>x.cat==='Ideas'||x.isIdea);return '<div class="emptybox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Ideas</h2><button class="add" onclick="addIdea()"> Idea</button></div>'+(list.length?list.map(x=>taskHTML(x,true)).join(''):'<div class="empty">No ideas yet.</div>')+'</div>'}
function addIdea(){let v=prompt('What is your idea?');if(!v)return;tasks.unshift({id:Date.now(),t:v,cat:'Ideas',p:'normal',due:'',time:'',repeat:'none',notes:'Idea',isIdea:true,done:false});save();refreshOther()}
function renderCompleted(){let list=tasks.filter(x=>x.done).sort((a,b)=>(b.due||'').localeCompare(a.due||''));return '<div class="emptybox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Completed</h2><div><button class="add" onclick="exportTasks()">Export</button> <button class="add" onclick="clearCompleted()">Clear completed</button></div></div>'+(list.length?list.map(x=>taskHTML(x,true)).join(''):'<div class="empty">No completed tasks yet.</div>')+'</div>'}
function renderRecurring(){let list=tasks.filter(x=>x.repeat&&x.repeat!=='none');return box('Recurring tasks',list.length?list.map(x=>taskHTML(x,true)).join(''):'<div class="empty">No recurring tasks yet.</div>')}
function renderProjects(){let projects=[{name:'Home & Garden',filter:'Home & Garden'},{name:'Properties',filter:'Properties'},{name:'Fitness',filter:'Fitness'},{name:'Others',filter:'Others'}];let out='<div class="emptybox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Projects</h2><button class="add" onclick="addProject()"> Project</button></div>';projects.forEach(p=>{let a=tasks.filter(x=>x.cat===p.filter),done=a.filter(x=>x.done).length,pc=a.length?Math.round(done/a.length*100):0;out+='<div style="margin-top:16px"><div style="display:flex;justify-content:space-between"><span>'+p.name+'</span><span>'+pc+'%</span></div><div class="bar"><div class="fill" style="width:'+pc+'%"></div></div>'+(a.length?a.map(x=>taskHTML(x,true)).join(''):'<div class="meta">No tasks in this project yet.</div>')+'</div>'});return out+'</div>'}
function addProject(){let n=prompt('Project name');if(!n)return;alert('Project "'+n+'" created as a category. Add tasks to it using the task category menu.')}
function exportTasks(){let blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mytasks-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function clearCompleted(){if(confirm('Clear all completed tasks?')){tasks=tasks.filter(x=>!x.done);save();render();refreshOther()}}
date.textContent=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
